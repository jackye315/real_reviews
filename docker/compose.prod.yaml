services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: []

  migrate:
    image: real-reviews-migrate-prod
    build:
      context: ../backend
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  api:
    image: real-reviews-api-prod
    build:
      context: ../backend
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      SERPAPI_LANGUAGE: ${SERPAPI_LANGUAGE:-en}
      REVIEWER_CONTEXT_ENABLED: ${REVIEWER_CONTEXT_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  frontend:
    image: real-reviews-frontend-prod
    build:
      context: ../frontend
      target: production
      args:
        VITE_REVIEWER_CONTEXT_ENABLED: ${VITE_REVIEWER_CONTEXT_ENABLED:-false}
    environment:
      VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
